version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: legaltech_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: legaltech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legaltech_net

  redis:
    image: redis:7-alpine
    container_name: legaltech_redis
    ports:
      - "6379:6379"
    networks:
      - legaltech_net

volumes:
  postgres_data:

networks:
  legaltech_net:
    driver: bridge
