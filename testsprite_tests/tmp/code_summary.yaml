version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React
  - Vite
  - TailwindCSS
  - Framer Motion
  - Lucide React
routes:
  - path: /login
    file: src/pages/auth/LoginPage.tsx
    auth_required: false
    description: User login page
  - path: /app/dashboard
    file: src/pages/dashboard/DashboardHome.tsx
    auth_required: true
    description: Main dashboard home
  - path: /app/clientes
    file: src/pages/clients/ClientsPage.tsx
    auth_required: true
    description: Clients management
  - path: /app/processos
    file: src/pages/processes/ProcessListPage.tsx
    auth_required: true
    description: Processes management
  - path: /app/financeiro
    file: src/pages/finance/FinancialListPage.tsx
    auth_required: true
    description: Financial management
features:
  - name: Global Rebrand to Advus
    description: Unified premium dark design across the platform.
    files:
      - src/pages/dashboard/DashboardHome.tsx
      - src/components/dashboard/WelcomeOverlay.tsx
      - src/components/layout/DashboardLayout.tsx
    entry_route: /app/dashboard
    user_interactions:
      - View unified sidebar and topbar
      - View rebranded Welcome overlay on login
      - Check metrics cards with glassmorphism
    auth_required: true
  - name: Dashboard Interaction
    description: View stats, deadlines, and recent activity.
    files:
      - src/pages/dashboard/DashboardHome.tsx
    entry_route: /app/dashboard
    user_interactions:
      - Drag and drop blocks to reorder
      - Toggle financial values visibility
      - Click on cards to navigate
    api_calls:
      - method: GET
        endpoint: /api/stats
    auth_required: true
known_limitations: []
