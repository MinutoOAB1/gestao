version: "2"
type: frontend
tech_stack:
  - React
  - TypeScript
  - Vite
  - Tailwind CSS
  - Framer Motion
  - Axios
routes:
  - path: /
    file: src/pages/landing/LandingPage.tsx
    auth_required: false
    description: Public landing page with product information
  - path: /login
    file: src/pages/auth/LoginPage.tsx
    auth_required: false
    description: User login page
  - path: /register
    file: src/pages/auth/RegisterPage.tsx
    auth_required: false
    description: New user registration page
  - path: /forgot-password
    file: src/pages/auth/ForgotPasswordPage.tsx
    auth_required: false
    description: Password recovery request page
  - path: /reset-password
    file: src/pages/auth/ResetPasswordPage.tsx
    auth_required: false
    description: Final password reset page with token
  - path: /app
    file: src/components/layout/DashboardLayout.tsx
    auth_required: true
    description: Main dashboard entry point
features:
  - name: Premium Landing Page
    description: Visual landing page for Advus branding
    files:
      - src/pages/landing/LandingPage.tsx
    entry_route: /
    user_interactions:
      - Scroll through features
      - Click CTA buttons to register
  - name: User Authentication
    description: Complete auth flow with login, register, and password recovery
    files:
      - src/pages/auth/LoginPage.tsx
      - src/pages/auth/RegisterPage.tsx
      - src/pages/auth/ForgotPasswordPage.tsx
      - src/pages/auth/ResetPasswordPage.tsx
    entry_route: /login
    user_interactions:
      - Fill login/register forms
      - Submit credentials
      - Follow password recovery link
    api_calls:
      - method: POST
        endpoint: /auth/login
      - method: POST
        endpoint: /auth/register
      - method: POST
        endpoint: /auth/forgot-password
      - method: POST
        endpoint: /auth/reset-password
  - name: IA Jurídica Premium
    description: AI analysis tool within the dashboard
    files:
      - src/components/layout/DashboardLayout.tsx
    entry_route: /app
    user_interactions:
      - Interact with AI widget
    api_calls:
      - method: POST
        endpoint: /ai/chat
known_limitations: []
